# DeepSeek-V3 family — class catalog (mixture-of-experts decoder-only LLMs).
#
# Uses Multi-head Latent Attention (MLA) instead of standard MHA.
# The first 3 layers are dense MLP; remaining layers use MoE.
# MoE block uses SharedFusedMoE (vLLM's fused implementation).

sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: [mlp]
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]

catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: DeepseekV2DecoderLayer
      tp_stable: true
    qkv_proj:
      vllm: DeepseekV2MLAAttention
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: DeepseekV2MLAAttention
    mlp:
      vllm: DeepseekV2MLP
    final_layernorm:
      vllm: RMSNorm
      within: DeepseekV3ForCausalLM
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  moe:
    moe:
      vllm: SharedFusedMoE
