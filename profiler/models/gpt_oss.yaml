# GPT-OSS family — class catalog (sink-attention MoE decoder LLMs).
#
# Covers openai/gpt-oss-20b and gpt-oss-120b (model_type ``gpt_oss``).
#
# DRAFT — written against vLLM v0.19.0 source
# (vllm/model_executor/models/gpt_oss.py: OAIAttention with learned
# sinks, alternating sliding-window(128)/full attention per layer,
# MLPBlock = GateLinear router + FusedMoE with top-4 of 128 experts).
# NOT yet validated by an actual profiling run — verify the class
# bindings on first use and adjust ``within`` scopes if the profiler's
# layerwise hook reports unmatched modules.
#
# Attention caveat: alternating SWA/full layers mean per-layer
# attention cost differs by layer parity. The profiler's uniform 4D
# sweep measures whatever vLLM executes for the profiled layer — for a
# first pass we accept the mixed measurement (the simulator applies one
# attention table to all layers, averaging the two regimes). A
# per-parity split (two attention tables) is future work.
#
# Profiling note: on non-Blackwell GPUs strip the MXFP4 quantization
# via hf_overrides={"quantization_config": None} to profile bf16.

sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: []
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]


catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: TransformerBlock
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
      within: OAIAttention
    o_proj:
      vllm: RowParallelLinear
      within: OAIAttention
    final_layernorm:
      vllm: RMSNorm
      within: GptOssModel
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
      within: OAIAttention
  moe:
    moe:
      vllm: MLPBlock
